name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./AltaLux

  # Configuration type to build.
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 outputs to <solution>/x64/Release; the Segmentation project
          # (ONNX Runtime) is x64-only, so the full solution builds here.
          - platform: x64
            output-dir: x64/Release
            vstest-platform: x64
          # Win32 outputs to <solution>/Release; AltaLuxSegmentation has no
          # Win32 config and is skipped by the solution mapping.
          - platform: Win32
            output-dir: Release
            vstest-platform: x86

    steps:
    - uses: actions/checkout@v4
    - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
      with:
        sdk-version: 16299

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore ONNX Runtime
      run: msbuild /t:Restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build ${{ matrix.platform }} solution
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{matrix.platform}} ${{env.SOLUTION_FILE_PATH}}

    - name: Run ${{ matrix.platform }} unit tests
      # vstest.console.exe is not on the runner PATH; locate it via vswhere.
      run: |
        $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "**\TestPlatform\vstest.console.exe" | Select-Object -First 1
        if (-not $vstest) { throw "vstest.console.exe not found via vswhere" }
        & $vstest "AltaLux/${{ matrix.output-dir }}/AltaLuxUnitTest.dll" "/Platform:${{ matrix.vstest-platform }}"
