name: Release x64 and Win32

on:
  push:
    tags:
      - "*"

env:
  SOLUTION_FILE_PATH: ./AltaLux
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Derive versioned asset names
        shell: pwsh
        # Release zips carry the tag so downloads are self-describing, e.g.
        # AltaLux-Win32-v3.0.0.zip; slashes in tag names would be illegal in
        # file names and are folded to '-'.
        run: |
          $version = "${{ github.ref_name }}" -replace '[/\\]', '-'
          "X64_RELEASE_ASSET_PATH=AltaLux-x64-$version.zip" | Add-Content $env:GITHUB_ENV
          "WIN32_RELEASE_ASSET_PATH=AltaLux-Win32-$version.zip" | Add-Content $env:GITHUB_ENV
          "AI_RELEASE_ASSET_PATH=AltaLux-AI-x64-$version.zip" | Add-Content $env:GITHUB_ENV

      - name: Set up Windows 10 SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
        with:
          sdk-version: 16299

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Build x64 DLL
        run: >-
          msbuild /m /restore
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=x64
          ${{ env.SOLUTION_FILE_PATH }}

      - name: Build Win32 DLL
        run: >-
          msbuild /m /restore
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=Win32
          ${{ env.SOLUTION_FILE_PATH }}

      - name: Package x64 DLL
        shell: pwsh
        # All platform packages are zips carrying the version in the file
        # name; each unzips to AltaLux.dll for the IrfanView Plugins folder.
        run: Compress-Archive -Path AltaLux/x64/Release/AltaLux.dll -DestinationPath ${{ env.X64_RELEASE_ASSET_PATH }}

      - name: Package Win32 DLL
        shell: pwsh
        run: Compress-Archive -Path AltaLux/Release/AltaLux.dll -DestinationPath ${{ env.WIN32_RELEASE_ASSET_PATH }}

      - name: Download pinned MobileSAM model bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download ai-model-v1
          --repo "${{ github.repository }}"
          --pattern "AltaLux-MobileSAM-models-v1.zip"
          --dir model-download

      - name: Assemble optional AI package
        shell: pwsh
        run: |
          Expand-Archive model-download/AltaLux-MobileSAM-models-v1.zip -DestinationPath ai-package
          python tools/verify_model_bundle.py ai-package
          Copy-Item AltaLux/x64/Release/AltaLuxSegmentation.dll ai-package/
          Copy-Item AltaLux/x64/Release/onnxruntime.dll ai-package/
          Copy-Item AltaLux/x64/Release/onnxruntime_providers_shared.dll ai-package/
          Copy-Item AltaLuxSegmentation/README.md ai-package/
          Copy-Item AltaLuxSegmentation/AltaLuxSegmentation-THIRD-PARTY-NOTICES.txt ai-package/
          Compress-Archive ai-package/* ${{ env.AI_RELEASE_ASSET_PATH }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "${{ env.X64_RELEASE_ASSET_PATH }}"
          "${{ env.WIN32_RELEASE_ASSET_PATH }}"
          "${{ env.AI_RELEASE_ASSET_PATH }}"
          --verify-tag
          --generate-notes
          --title "${{ github.ref_name }}"
